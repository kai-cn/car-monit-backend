name: car-monit-go

on:
  push:
    branches: [master, car-monit-go-V2]
    paths:
      - 'car-monit-go/**'
      - '.github/workflows/car-monit-go-ci.yml'
  pull_request:
    paths:
      - 'car-monit-go/**'
      - '.github/workflows/car-monit-go-ci.yml'

concurrency:
  group: car-monit-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-monit-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: car-monit-go/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go mod tidy 校验
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build
        run: go build -buildvcs=false ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -buildvcs=false -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          working-directory: car-monit-go
          args: --timeout=5m

  perms-parity:
    # 静态比对 Java 注解与 Go 路由注册的权限/操作日志，防止再次漏挂。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check permissions parity
        working-directory: car-monit-go
        run: |
          python scripts/parity/check_perms.py \
            --java-root ../ruoyi-admin/src/main/java/com/ruoyi/web/controller \
            --go-root internal
