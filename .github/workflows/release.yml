# ============================================================================
# 文件：.github/workflows/release.yml
# 用途：发布流程：构建各语言产物并上传 GitHub Release（含 SHA256SUMS）
# 触发：push 事件
# 主要 job：build-java、build-go、build-rust、build-py
# 说明：本文件仅新增中文注释，不改动任何执行逻辑；runner/权限/守卫以实际配置为准。
# ============================================================================
name: release

# tag 触发：产出 jar / Go 二进制 / Rust 二进制 / Python wheel，并创建 GitHub Release。
# 镜像构建与 GHCR 推送在 cd.yml 中完成，本文件只管 GitHub Release 制品。
# 不使用 force push，不在本文件写任何真实凭据。

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── job: build-java ──
  build-java:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4
      # 安装 JDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 打包
        run: mvn -B -DskipTests package
      # 上传产物供后续 job/Release 使用
      - uses: actions/upload-artifact@v4
        with:
          name: build-java
          path: ruoyi-admin/target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ── job: build-go ──
  build-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-monit-go
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: car-monit-go/go.sum
      - name: 构建 Linux 二进制
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "-s -w" \
            -o dist/carmonit-server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "-s -w" \
            -o dist/carmonit-migrate-linux-amd64 ./cmd/migrate
      # 上传产物供后续 job/Release 使用
      - uses: actions/upload-artifact@v4
        with:
          name: build-go
          path: car-monit-go/dist/*
          if-no-files-found: error
          retention-days: 7

  # ── job: build-rust ──
  build-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-monit-rust
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 car-monit-rust/rust-toolchain.toml 一致
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: car-monit-rust
      - name: 构建 release 二进制
        run: cargo build --release
      # 上传产物供后续 job/Release 使用
      - uses: actions/upload-artifact@v4
        with:
          name: build-rust
          path: car-monit-rust/target/release/car-monit-rust
          if-no-files-found: error
          retention-days: 7

  # ── job: build-py ──
  build-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-monit-py
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4
      # 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建 wheel / sdist
        run: |
          pip install build
          python -m build
      # 上传产物供后续 job/Release 使用
      - uses: actions/upload-artifact@v4
        with:
          name: build-py
          path: car-monit-py/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-java, build-go, build-rust, build-py]
    runs-on: ubuntu-latest
    steps:
      # 下载上游 workflow 产物
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: 列出产物
        run: ls -la dist
      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: true
