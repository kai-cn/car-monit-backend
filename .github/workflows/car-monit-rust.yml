name: car-monit-rust

on:
  push:
    paths:
      - 'car-monit-rust/**'
      - '.github/workflows/car-monit-rust.yml'
  pull_request:
    paths:
      - 'car-monit-rust/**'
  workflow_dispatch:
    inputs:
      java_base:
        description: 'Java 基址（需 runner 能访问，例如 http://10.0.0.5:9988）'
        required: false
        default: ''
      rust_base:
        description: 'Rust 基址（需 runner 能访问，例如 http://10.0.0.5:9990）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-monit-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: car-monit-rust
      - name: fmt
        # 迁移期先只做提示：全量 `cargo fmt --all` 会重排整个 crate，等单独提交。
        continue-on-error: true
        run: cargo fmt --all --check
      - name: clippy
        # 同上：现存告警（module inception、needless ?、format! 等）尚未清零。
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --lib

  # 两端对比依赖同一份 MySQL + Redis 上跑起来的 Java 与 Rust，公共 runner 起不来，
  # 因此只在手动触发且填入可达基址时执行。
  parity:
    if: github.event_name == 'workflow_dispatch' && inputs.java_base != '' && inputs.rust_base != ''
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成端点清单
        working-directory: car-monit-rust
        run: python -m tools.endpoint_parity.endpoints
      - name: 两端 GET 对比（有硬差异即失败）
        working-directory: car-monit-rust
        env:
          PARITY_USER: ${{ secrets.PARITY_USER }}
          PARITY_PASSWORD: ${{ secrets.PARITY_PASSWORD }}
        run: |
          python -m tools.endpoint_parity.compare \
            --java-base "${{ inputs.java_base }}" \
            --rust-base "${{ inputs.rust_base }}" \
            --report build/parity-report.json --strict --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: car-monit-rust/build/parity-report.json
