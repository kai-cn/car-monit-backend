name: self-hosted-ci

# 账号级 GitHub-hosted runner 因账单/支出限额不可用时，V3 分支的可用 CI/CD 入口。
# 运行在本机 WSL2 openEuler 自托管 runner（label: wsl-k3s），集群为 k3d 一主两从。
on:
  workflow_dispatch:
  push:
    branches:
      - car-monit-backend-java-V3
      - car-monit-backend-jdk17
    paths:
      - .github/workflows/self-hosted-ci.yml
      - pom.xml
      - ruoyi-common/**
      - ruoyi-system/**
      - ruoyi-framework/**
      - ruoyi-admin/**

permissions:
  contents: read

jobs:
  build:
    name: compile-and-test
    runs-on: [self-hosted, linux, x64, wsl-k3s]
    timeout-minutes: 45
    steps:
      - name: Runner environment
        run: |
          set +e
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          uname -a
          echo "cpus=$(nproc)"
          free -m | head -2
          echo "===== DIAG: NODE / TOOLCACHE ====="
          echo "node=$(node -v 2>&1)"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE}"
          echo "===== DIAG: PROXY ====="
          env | grep -iE 'proxy|no_proxy' || echo "(no proxy vars)"
          echo "===== DIAG: JAVA ====="
          command -v java || echo "(java NOT on PATH)"
          java -version 2>&1
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "===== DIAG: /usr/lib/jvm ====="
          ls -la /usr/lib/jvm 2>&1
          echo "===== DIAG: toolcache tree ====="
          find /opt/hostedtoolcache -maxdepth 4 -type d 2>&1 | head -60
          echo "===== DIAG: other JDK homes ====="
          ls -d /opt/jdk* /opt/java* /usr/local/jdk* /opt/actions-runner/_work/_tool/* 2>&1
          echo "===== DIAG: MAVEN ====="
          command -v mvn || echo "(mvn NOT on PATH)"
          mvn -v 2>&1 | head -6
          echo "===== DIAG: NETWORK EGRESS ====="
          curl -sS -m 20 -o /dev/null -w "api.adoptium.net HTTP=%{http_code} time=%{time_total}\n" https://api.adoptium.net/v3/info/available_releases 2>&1
          curl -sS -m 20 -o /dev/null -w "api.github.com   HTTP=%{http_code} time=%{time_total}\n" https://api.github.com 2>&1
          curl -sS -m 20 -o /dev/null -w "repo.maven.org   HTTP=%{http_code} time=%{time_total}\n" https://repo.maven.apache.org/maven2/ 2>&1
          echo "===== DIAG: DNS ====="
          getent hosts api.adoptium.net || echo "(adoptium DNS FAIL)"
          echo "===== DIAG: DOCKER / K3S ====="
          docker ps --format '{{.Names}} {{.Status}}' 2>&1 | head -20
          echo "===== DIAG: END ====="

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (branch-pinned toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Assert toolchain matches branch
        run: |
          set -euo pipefail
          java -version 2>&1 | head -2
          mvn -v | head -3
          java -version 2>&1 | grep -qE 'version "17\.' || {
            echo "::error::branch car-monit-backend-jdk17 requires JDK 17, runner java differs"; exit 1; }

      - name: Compile V3 modules
        run: mvn -B -q -DskipTests -pl ruoyi-common,ruoyi-system,ruoyi-framework,ruoyi-admin -am compile

      - name: Unit tests
        run: mvn -B -q -pl ruoyi-common,ruoyi-system -am test

  deploy:
    name: deploy-to-k3s
    needs: build
    runs-on: [self-hosted, linux, x64, wsl-k3s]
    timeout-minutes: 15
    steps:
      - name: Verify cluster (1 control-plane + 2 agents)
        run: docker exec k3d-v3-server-0 kubectl get nodes

      - name: Roll out demo workload on 3 nodes
        run: |
          docker exec k3d-v3-server-0 kubectl create deployment v3-ci-probe \
            --image=rancher/mirrored-pause:3.6 --replicas=3 \
            --dry-run=client -o yaml | docker exec -i k3d-v3-server-0 kubectl apply -f -
          docker exec k3d-v3-server-0 kubectl rollout status deployment/v3-ci-probe --timeout=240s
          docker exec k3d-v3-server-0 kubectl get pods -l app=v3-ci-probe -o wide
