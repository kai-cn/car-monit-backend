# ============================================================================
# 文件：.github/workflows/cd.yml
# 用途：持续部署：构建镜像并部署到目标环境
# 触发：手动 dispatch / push 事件
# 主要 job：image-java、image-go、image-rust、image-py
# 说明：本文件仅新增中文注释，不改动任何执行逻辑；runner/权限/守卫以实际配置为准。
# ============================================================================
name: cd

# 镜像构建与 GHCR 推送。
# - push 到 master：推 sha 短哈希 + latest
# - push tag v*.*.*：推 sha 短哈希 + 版本号（如 1.2.3）
# 不使用 PAT：登录 GHCR 用 GITHUB_TOKEN + permissions.packages=write。
#
# 未覆盖的语言：
# - C++：car-monit-cpp 的依赖走 vcpkg manifest，仓库里只有 Windows triple（vcpkg_installed/x64-windows），
#   Linux 镜像需要重新构建 librdkafka 及其依赖，成本与风险都未验证，因此 CD 不覆盖 C++。
#   需要 C++ 镜像时，先补一份 Linux 可用的依赖方案与 Dockerfile 再接这里。
#
# 镜像名固定为 ghcr.io/kai-cn/car-monit-<service>。

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── job: image-java ──
  image-java:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kai-cn/car-monit-java
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送 Docker 镜像
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/java.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java
          cache-to: type=gha,mode=max,scope=java

  # ── job: image-go ──
  image-go:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kai-cn/car-monit-go
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送 Docker 镜像
      - uses: docker/build-push-action@v6
        with:
          context: car-monit-go
          # build-push-action 的 file 相对 workspace 根解析，不是相对 context
          file: car-monit-go/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

  # ── job: image-rust ──
  image-rust:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kai-cn/car-monit-rust
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送 Docker 镜像
      - uses: docker/build-push-action@v6
        with:
          context: car-monit-rust
          file: car-monit-rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rust
          cache-to: type=gha,mode=max,scope=rust

  # ── job: image-py ──
  image-py:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kai-cn/car-monit-py
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送 Docker 镜像
      - uses: docker/build-push-action@v6
        with:
          context: car-monit-py
          file: car-monit-py/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=py
          cache-to: type=gha,mode=max,scope=py
