name: diagnose-runner
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: runner-probe
    runs-on: [self-hosted, linux, x64, wsl-k3s]
    timeout-minutes: 10
    steps:
      - name: Dump runner JDK / network / cluster facts
        run: |
          set +e
          echo "===== IDENTITY ====="
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          uname -a
          echo "node=$(node -v 2>&1) npm=$(npm -v 2>&1)"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE}"
          echo "===== PROXY ENV ====="
          env | grep -iE 'proxy|no_proxy' || echo "(no proxy vars)"
          echo "===== JAVA ====="
          command -v java || echo "(java not on PATH)"
          java -version 2>&1
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "===== /usr/lib/jvm ====="
          ls -la /usr/lib/jvm 2>&1
          echo "===== toolcache ====="
          find /opt/hostedtoolcache -maxdepth 4 -type d 2>&1 | head -60
          echo "===== other JDK homes ====="
          ls -d /opt/jdk* /opt/java* /usr/local/jdk* 2>&1
          echo "===== MAVEN ====="
          command -v mvn || echo "(mvn not on PATH)"
          mvn -v 2>&1 | head -6
          echo "===== NETWORK EGRESS ====="
          curl -sS -m 20 -o /dev/null -w "api.adoptium.net  HTTP=%{http_code} time=%{time_total}\n" https://api.adoptium.net/v3/info/available_releases 2>&1
          curl -sS -m 20 -o /dev/null -w "api.github.com    HTTP=%{http_code} time=%{time_total}\n" https://api.github.com 2>&1
          curl -sS -m 20 -o /dev/null -w "github releases   HTTP=%{http_code} time=%{time_total}\n" -L https://github.com/adoptium/temurin17-binaries/releases/latest 2>&1
          curl -sS -m 20 -o /dev/null -w "repo1.maven.org   HTTP=%{http_code} time=%{time_total}\n" https://repo.maven.apache.org/maven2/ 2>&1
          echo "===== DNS ====="
          getent hosts api.adoptium.net || echo "(adoptium DNS fail)"
          echo "===== DOCKER / K3S ====="
          docker ps --format '{{.Names}}\t{{.Status}}' 2>&1 | head -20
          echo "===== setup-java v4 resolve simulation ====="
          curl -sS -m 20 -o /dev/null -w "adoptium feature_releases HTTP=%{http_code} time=%{time_total}\n" \
            'https://api.adoptium.net/v3/assets/feature_releases/17/ga?architecture=x64&heap_size=normal&image_type=jdk&jvm_impl=hotspot&os=linux&project=jdk&vendor=eclipse' 2>&1
          echo "===== DONE ====="
