# ============================================================================
# backend 认证态全端点跨语言对比（Java8 基线 vs Go / Python / Rust）
# ============================================================================
# 与 crosslang-parity-cloud.yml 的区别：
#   * crosslang 用 parity_probe.py 只探 2 个免认证端点（/captchaImage、/）；
#   * 本 workflow 用 parity_auth_probe.py 先登录拿 Bearer token，再探全部
#     认证态业务端点（endpoints/backend-full.txt，16 个），并对 RuoYi
#     「HTTP 200 但 body.code=401/403/500」的假绿做绝对失败断言。
#
# 每个变体在独立 runner 上：起 MySQL8 + Redis -> 构建 -> 认证探针采集 ->
# 上传 JSON；候选 job 下载 Java8 基线 JSON，用 parity_compare.py 做
# status/exact/semantic/nondet 判定，AUTH_FAIL 或 DIFF 即失败。
#
# 凭据：管理员账号来自仓库 Variables/Secrets（AUTH_USER/AUTH_PASS）；
#       未配置时回退到默认测试值（与 scripts/parity/pp.py 一致）。
# workflow_dispatch only.

name: backend-auth-parity-cloud

on:
  workflow_dispatch:
    inputs:
      langs:
        description: comma list of go,python,rust, or 'all'
        type: string
        default: all
      linux_runner:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: backend-auth-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp
  # 管理员测试账号（与 parity/pp.py 一致）；可在仓库 Variables 覆盖
  AUTH_USER: ${{ vars.AUTH_USER || 'admin' }}
  AUTH_PASS: ${{ secrets.AUTH_PASS || 'Admin@2025-' }}
  ENDPOINTS: scripts/v3/ops/parity/endpoints/backend-full.txt

jobs:
  # ── Java8 基线：认证态采集全端点 ──
  baseline-java8:
    runs-on: ${{ inputs.linux_runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          cache: maven
          distribution: temurin
          java-version: '8'
      - name: Start datastores + seed
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name my -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=carmonitdb -p 3306:3306 mysql:8.0 --default-authentication-plugin=mysql_native_password
          docker run -d --name rd -p 6379:6379 redis:7-alpine
          for i in $(seq 1 60); do docker exec my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -e 'select 1' >/dev/null 2>&1 && break; sleep 2; done
          docker exec -i my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -D carmonitdb < scripts/v3/ops/parity/sql/schema_carmonitdb.sql
          docker exec -i my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -D carmonitdb < scripts/v3/ops/parity/sql/seed_carmonitdb.sql
          echo "sys_user rows: $(docker exec my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -N -e 'select count(*) from carmonitdb.sys_user')"
      - name: Build Java8 jar
        shell: bash
        run: |
          set -euo pipefail
          # logback.xml 固定写 /home/ruoyi/logs；确保存在，避免文件 appender 报错
          sudo mkdir -p /home/ruoyi/logs && sudo chmod 777 /home/ruoyi/logs
          mvn $MAVEN_ARGS -DskipTests -pl ruoyi-admin -am package
          mkdir -p out
          cp $(ls ruoyi-admin/target/*.jar | grep -v original | head -1) out/baseline.jar
          ls -lh out/baseline.jar
      - name: Probe Java8 (authenticated, full endpoints)
        shell: bash
        env:
          SPRING__DATASOURCE__DRUID__MASTER__URL: jdbc:p6spy:mysql://127.0.0.1:3306/carmonitdb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowMultiQueries=true
          SPRING__DATASOURCE__DRUID__MASTER__USERNAME: root
          SPRING__DATASOURCE__DRUID__MASTER__PASSWORD: root
          SPRING__REDIS__HOST: 127.0.0.1
          SPRING__REDIS__PORT: "6379"
          TOKEN__SECRET: parity-cloud-secret-deterministic
        run: |
          set -uo pipefail
          python scripts/v3/ops/parity/parity_auth_probe.py --variant java8 --label java8-auth \
            --cmd "java -jar out/baseline.jar --server.port=19903" --port 19903 \
            --endpoints "$ENDPOINTS" --auth-lang java \
            --user "$AUTH_USER" --password-env AUTH_PASS \
            --out out/java8.json --mode full --check-stability --ready-timeout 300 || echo "baseline auth probe exit=$?"
      - name: Diagnose Java8 startup (if failed)
        if: always()
        shell: bash
        run: |
          echo "===== java8.json.app.log tail ====="
          tail -80 out/java8.json.app.log 2>/dev/null || echo "(no app.log)"
      - name: Gate Java8 baseline quality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          d=json.load(open('out/java8.json'))
          ep=d.get('endpoint_count',0); ready=d.get('diff_ready',0); af=d.get('auth_fail_count',0)
          err=d.get('error'); login=d.get('login') or {}
          print('JAVA8_AUTH_SUMMARY login_token=%s endpoints=%d diff_ready=%d auth_fail=%d error=%s' % (
              bool(login.get('token') if isinstance(login,dict) else False), ep, ready, af, err))
          # 基线质量门禁：必须无 error、有足够可用端点、无认证失败
          if err:
              print('::error::Java8 baseline probe error: %s' % err); sys.exit(1)
          if not (isinstance(login,dict) and login.get('code')==200):
              print('::error::Java8 login did not return code=200: %s' % login); sys.exit(1)
          if ready < 10:
              print('::error::Java8 diff_ready=%d < 10, baseline unusable' % ready); sys.exit(1)
          if af > 0:
              print('::error::Java8 auth_fail=%d on baseline' % af); sys.exit(1)
          print('JAVA8_BASELINE_GATE_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-baseline-java8
          path: out/**
          retention-days: 30
      - name: Stop datastores
        if: always()
        shell: bash
        run: docker rm -f my rd 2>/dev/null || true

  # ── 候选：Go / Python / Rust 认证态采集 + 对比 ──
  candidates:
    needs: baseline-java8
    runs-on: ${{ inputs.linux_runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lang: [go, python, rust]
    steps:
      - uses: actions/checkout@v4
      - id: gate
        shell: bash
        env:
          IN: ${{ inputs.langs }}
          LANG: ${{ matrix.lang }}
        run: |
          if [ "$IN" = "all" ] || echo ",$IN," | grep -q ",$LANG,"; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - name: Start datastores + seed
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name my -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=carmonitdb -p 3306:3306 mysql:8.0 --default-authentication-plugin=mysql_native_password
          docker run -d --name rd -p 6379:6379 redis:7-alpine
          for i in $(seq 1 60); do docker exec my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -e 'select 1' >/dev/null 2>&1 && break; sleep 2; done
          docker exec -i my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -D carmonitdb < scripts/v3/ops/parity/sql/schema_carmonitdb.sql
          docker exec -i my mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -proot -D carmonitdb < scripts/v3/ops/parity/sql/seed_carmonitdb.sql
      - name: Download baseline probe
        if: steps.gate.outputs.run == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: auth-baseline-java8
          path: out
      - name: Build Go
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'go'
        shell: bash
        run: |
          set -euo pipefail
          cd car-monit-go && go build -o bin/car-monit-go ./cmd/server
      - name: Probe Go (auth)
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'go'
        shell: bash
        env:
          CARMONIT_DATABASE_DSN: "root:root@tcp(127.0.0.1:3306)/carmonitdb?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true"
          CARMONIT_REDIS_ADDR: "127.0.0.1:6379"
          CARMONIT_SERVER_PORT: "9989"
        run: |
          set -uo pipefail
          python scripts/v3/ops/parity/parity_auth_probe.py --variant go --label go-auth \
            --cmd "car-monit-go/bin/car-monit-go -c car-monit-go/configs/config.yaml" --port 9989 \
            --endpoints "$ENDPOINTS" --auth-lang go \
            --user "$AUTH_USER" --password-env AUTH_PASS \
            --out out/go.json --mode full --check-stability --ready-timeout 120 || echo "go auth probe exit=$?"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'python'
        with:
          python-version: '3.12'
      - name: Setup Python + deps
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'python'
        shell: bash
        run: |
          set -euo pipefail
          # Pillow 的 JPEG 支持需要系统头；PyO3 依赖(orjson/pydantic-core)在 3.14 无法编译
          sudo apt-get update -qq && sudo apt-get install -y -qq libjpeg-dev zlib1g-dev >/dev/null
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q -r car-monit-py/requirements.txt
          sed -i 's#127\.0\.0\.1:3307#127.0.0.1:3306#g; s#useSSL=true#useSSL=false#g' car-monit-py/config/application.yml
      - name: Probe Python (auth)
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'python'
        shell: bash
        run: |
          set -uo pipefail
          python scripts/v3/ops/parity/parity_auth_probe.py --variant python --label python-auth \
            --cmd "cd car-monit-py && python3 -m uvicorn app.main:app --host 127.0.0.1 --port 9989" --port 9989 \
            --endpoints "$ENDPOINTS" --auth-lang python \
            --user "$AUTH_USER" --password-env AUTH_PASS \
            --out out/python.json --mode full --check-stability --ready-timeout 180 || echo "python auth probe exit=$?"
      - name: Build Rust
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          cd car-monit-rust && cargo build --release 2>&1 | tail -3
      - name: Probe Rust (auth)
        if: steps.gate.outputs.run == 'yes' && matrix.lang == 'rust'
        shell: bash
        run: |
          set -uo pipefail
          sudo mkdir -p /home/ruoyi/logs && sudo chmod 777 /home/ruoyi/logs
          sed -i 's#127\.0\.0\.1:3307#127.0.0.1:3306#g; s#useSSL=true#useSSL=false#g' car-monit-rust/config/application.yaml
          python scripts/v3/ops/parity/parity_auth_probe.py --variant rust --label rust-auth \
            --cmd "cd car-monit-rust && ./target/release/car-monit-rust" --port 9989 \
            --endpoints "$ENDPOINTS" --auth-lang rust \
            --user "$AUTH_USER" --password-env AUTH_PASS \
            --out out/rust.json --mode full --check-stability --ready-timeout 240 || echo "rust auth probe exit=$?"
      - name: Diagnose candidate startup (if failed)
        if: always() && steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          echo "===== ${{ matrix.lang }} app.log tail ====="
          tail -40 "out/${{ matrix.lang }}.json.app.log" 2>/dev/null || echo "(no app.log)"
      - name: Compare vs Java8 (authenticated, full endpoints)
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          CAND="out/${{ matrix.lang }}.json"
          if [ ! -f "$CAND" ]; then echo "::error::${{ matrix.lang }} auth probe JSON missing"; exit 1; fi
          python - "$CAND" "${{ matrix.lang }}" <<'PY'
          import json, sys
          lang=sys.argv[2]
          d=json.load(open(sys.argv[1]))
          ep=d.get('endpoint_count',0); ready=d.get('diff_ready',0); af=d.get('auth_fail_count',0)
          err=d.get('error'); login=d.get('login') or {}
          print('%s_AUTH_SUMMARY login_code=%s endpoints=%d diff_ready=%d auth_fail=%d error=%s' % (
              lang, login.get('code') if isinstance(login,dict) else None, ep, ready, af, err))
          if err:
              print('::error::%s probe error: %s' % (lang, err)); sys.exit(1)
          if not (isinstance(login,dict) and login.get('code')==200):
              print('::error::%s login did not return code=200: %s' % (lang, login)); sys.exit(1)
          if ready < 10:
              print('::error::%s diff_ready=%d < 10, candidate unusable' % (lang, ready)); sys.exit(1)
          if af > 0:
              print('::warning::%s auth_fail=%d on candidate (compare will gate details)' % (lang, af))
          print('%s_CANDIDATE_GATE_OK' % lang)
          PY
          set +e
          python scripts/v3/ops/parity/parity_compare.py \
            --baseline out/java8.json --candidate "$CAND" \
            --out "out/report-${{ matrix.lang }}.json" --md "out/report-${{ matrix.lang }}.md" \
            --label "java8-vs-${{ matrix.lang }}-auth"
          RC=$?
          set -e
          echo "===== parity report (${{ matrix.lang }}) ====="
          cat "out/report-${{ matrix.lang }}.md" 2>/dev/null || true
          echo "PARITY_COMPARE_RC=$RC"
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'yes'
        with:
          name: auth-candidate-${{ matrix.lang }}
          path: out/**
          retention-days: 30
      - name: Stop datastores
        if: always()
        shell: bash
        run: docker rm -f my rd 2>/dev/null || true
