# 项目相关配置
ruoyi:
  # 名称
  name: 系统
  # 版本
  version: 3.8.7
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 9989
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# ========================================
# 监控组件配置（链路追踪、慢请求、告警）
# ========================================
monitor:
  # 监控开关（true=启用，false=关闭所有监控功能）
  enabled: true
  # 慢请求阈值（毫秒），超过此值的请求会被标记为慢请求
  slow-request-threshold: 3000
  # 慢方法阈值（毫秒），超过此值的方法调用会被记录
  slow-method-threshold: 500
  # 慢SQL阈值（毫秒），超过此值的SQL会被记录并告警
  slow-sql-threshold: 1000
  # TraceId请求头名称（微服务间传递用）
  trace-id-header: X-Trace-Id
  # 告警窗口大小（毫秒），在此窗口内同类告警只通知一次
  alert-window-ms: 60000
  # 告警阈值（窗口内允许的最大告警数）
  alert-max-count: 5

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  main:
    # Spring Framework 6.2 起循环引用永久禁止（allow-circular-references 已移除），
    # 这里只保留 Bean 覆盖开关；如启动报循环依赖需按实际装配链改造，不能靠配置绕过。
    allow-bean-definition-overriding: true
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 40MB
      # 设置总上传的文件大小
      max-request-size: 200MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置（Boot 3 起前缀由 spring.redis 迁移为 spring.data.redis）
  data:
    redis:
      # 地址
      host: 127.0.0.1
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 120

# MyBatis配置
mybatis-plus:
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      id-type: ASSIGN_ID
      # 默认数据库表下划线命名
      table-underline: true
  # 搜索指定包别名 ， 除了扫描实体类包，还扫跟实体类映射相关的bean
  typeAliasesPackage: com.ruoyi.**.domain,com.ruoyi.**.bean
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

#生成mybatis-plus代码开关，默认false
generator-code:
  mybatis-plus:
    enable: true

# Swagger配置
swagger:
  # 是否开启swagger（true 时 SwaggerConfig 才注册 OpenAPI Bean）
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# OpenAPI 3（springdoc）文档开关，与 swagger.enabled 保持一致，生产关闭
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# minio配置
oss:
  endpoint: http://172.30.100.102:9002
  accessKey: jtwl_access_key
  secretKey: minio.prod
  bucketName: developer

sms:
  signature:
  accessKeyId:
  accessKeySecret:
  sendCodeTemplete:
  sendCheckPersonNoticeTemplete:
  sendExpertNoticeTemplete:
  sendSupplierInvitationsNoticeTemplete:
  sendInvitationSupplierTemplate:
  sendYckbSupplierTemplate:

forest:
  bean-id: forestConfiguration
  backend: httpclient
  max-connections: 1000 # 连接池最大连接数，默认值为500
  max-route-connections: 500 # 每个路由的最大连接数，默认值为500
  timeout: 60000 # 请求超时时间，单位为毫秒, 默认值为3000
  connect-timeout: 60000 # 连接超时时间，单位为毫秒, 默认值为2000
  logEnabled: true # 打开或关闭日志，默认为true
  retryer: com.dtflys.forest.retryer.BackOffRetryer
  retry-count: 2
  max-retry-interval: 1000
  variables:
    hendaUrl: http://36.200.20.14:7890/8809/geoserver-pg/rest

hengda:
  appid: YHZS
  secret: b48381c4b98311ea90b100155d14fa3b

vehicleMonitor:
  # 可用 VEHICLE_MONITOR_BASE_URL 覆盖；api V3 默认端口将对齐为 9902（Java 端）
  baseUrl: ${VEHICLE_MONITOR_BASE_URL:http://127.0.0.1:9902}

# backend → api 查询契约客户端：连接/读超时与重试按场景隔离
# 预算原则：backend 读超时 > api 处理超时 + 缓冲；POST（导出提交）不重试
traffic-api:
  # 与 api 的 traffic.security.internal-token 保持一致；为空时 api 仅允许回环调用
  internal-token: ${TRAFFIC_API_INTERNAL_TOKEN:}
  connect-timeout-ms: 1000
  # 列表：api 列表 SLO ≤2s
  list-read-timeout-ms: 2500
  # 扩展流水（省界/收费站抓拍、称重、出入口、服务区）：api 侧 GaussDB 分页
  flow-extended-read-timeout-ms: 5000
  # 轨迹在线：api 侧 ES 元数据 + GaussDB 轨迹点批量回查
  trail-read-timeout-ms: 6000
  # 统计：api traffic.bigscreen.query-timeout-ms=2000，backend 读 3s 避免倒挂
  stats-read-timeout-ms: 3000
  # 实时预警列表（api 暂未实现，404 后走 Redis 快照）
  warning-list-read-timeout-ms: 2000
  # 导出提交：只提交异步任务，不等待文件生成
  export-submit-read-timeout-ms: 6000
  # 导出状态：轮询接口，保持短超时
  export-status-read-timeout-ms: 2000
  # 旧同步导出：listToExport 会同步扫库，1 万条上限
  legacy-export-read-timeout-ms: 30000
  retry-count: 1
  stats-retry-count: 0
  flow-extended-retry-count: 0
  trail-retry-count: 0
  warning-list-retry-count: 0
  export-submit-retry-count: 0
  export-status-retry-count: 1
  legacy-export-retry-count: 0
  retry-backoff-ms: 200
  circuit-failure-threshold: 5
  circuit-open-ms: 30000
  circuit-half-open-permits: 1
  contract-probe-interval-ms: 60000
  # 指标告警阈值（每分钟检查一次）
  metrics:
    enabled: true
    timeout-rate-threshold: 0.2
    cache-hit-rate-threshold: 0.5
    degrade-per-minute-threshold: 10
    export-backlog-threshold: 20

# 大屏统计源：api=只走 api；legacy=只走本地业务表；hybrid=api 优先、失败回退 legacy
bigscreen:
  stats:
    mode: hybrid
  # 轨迹在线查询：api=走 api 轨迹接口（默认）；local=强制本地旧表；其余值按 api 优先
  trail:
    mode: api
  # 全字段导出维度过滤能力：auto=探测 api /api/v3/export/capabilities；true/false=强制开关
  export:
    full-dimension-filters: auto
  # 灰度/回滚开关默认值（Redis cm:{env}:switch:{name} 可运行期覆盖）
  switches:
    stats-api-first: true
    warning-api: true
    location-index: true
    export-v3: true
    dict-version: true
    trail-api: true
    export-approval: false
    # 轨迹本地物化默认关闭（Quartz 同步任务写 zdata_trail_tracks 的入口）
    trail-materialize: false
  # 灰度规则（可选）：租户白名单优先，其次按 percent 稳定哈希放量；Redis 可运行期覆盖
  gray:
    stats-api-first:
      percent: 100
      tenants: []
    warning-api:
      percent: 100
      tenants: []
    export-v3:
      percent: 100
      tenants: []

# 导出下载签名、限流与保留期
export:
  # 任务元数据/审批请求保留天数（Redis TTL）
  retention-days: 7
  # 过期运行中任务清理（仅清理本地积压指标，Redis 元数据由 TTL 清理）
  cleanup:
    enabled: true
    interval-ms: 3600000
  download:
    # 下载令牌签名密钥：必须独立配置，未配置（或使用历史默认值/长度不足 16 位）时应用启动失败。
    # 生产通过环境变量 EXPORT_DOWNLOAD_SECRET 注入；不要复用 token.secret。
    secret: ${EXPORT_DOWNLOAD_SECRET:}
    token-ttl-seconds: 900
    rate-limit-per-minute: 6
    connect-timeout-ms: 3000
    read-timeout-ms: 1800000

isLocalhost: local # 是否本地 prod生成

tx-service-url: https://apis.map.qq.com

#路网路径
roadPathUrl: http://36.200.30.117:8080

# Kafka配置（生产级优化版）
kafka:
  bootstrap-servers: 127.0.0.1:9092
  
  # 主题配置
  topic:
    snapshot-flow: ods-rt-szdn-snapshot-flow
    snapshot-flow-dlq: ods-rt-szdn-snapshot-flow-dlq
  
  consumer:
    group-id: snapshot-flow-consumer-group
    enable-auto-commit: false
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    
    # 生产级优化配置（针对300G历史数据）
    max-poll-records: 500
    max-poll-interval-ms: 300000
    fetch-max-bytes: 52428800
    session-timeout-ms: 60000
  
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    retries: 3
  
  listener:
    ack-mode: manual_immediate
    concurrency: 3

# Elasticsearch配置
elasticsearch:
  host: 127.0.0.1
  port: 9200
  index:
    snapshot-flow

# 幂等性配置
idempotent:
  redis:
    prefix: snapshot:flow:idempotent_
    expire-time: 86400

# 快照流分表配置
snapshot:
  flow:
    sharding:
      enabled: true
      table-prefix: ods_rt_szdn_snapshot_flow_
      sharding-field: snapshottime
      sharding-type: month
