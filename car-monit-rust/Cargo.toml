[package]
name = "car-monit-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Java RuoYi car-monit backend migrated to Rust (Axum + SQLx)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "fs",
    "limit",
    "compression-gzip",
    "catch-panic",
] }
hyper = { version = "1", features = ["full"] }
http = "1"
bytes = "1"

serde = { version = "1", features = ["derive"] }
# float_roundtrip: 按 Java 的十进制字面量原样读写浮点（默认实现会把 115.86275068219831 读成 …32）。
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "mysql",
    "chrono",
    "rust_decimal",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
redis = { version = "0.27", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde-with-float"] }
uuid = { version = "1", features = ["v4", "serde"] }

jsonwebtoken = "9"
bcrypt = "0.16"
config = { version = "0.15", default-features = false, features = ["yaml"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# sqlx ConnectOptions::log_statements 的参数类型（log::LevelFilter）。
log = "0.4"
# 日志 Throwable 栈帧：std 的 Backtrace::frames() 仍是 unstable，使用 stable 的 backtrace crate。
backtrace = "0.3"

validator = { version = "0.19", features = ["derive"] }
dashmap = "6"
parking_lot = "0.12"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "multipart",
] }
base64 = "0.22"
rand = "0.8"
regex = "1"
once_cell = "1"
futures = "0.3"
async-trait = "0.1"
url = "2"
serde_urlencoded = "0.7"
mime_guess = "2"
percent-encoding = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# `kafka` / `oss` 是**未接线**的占位 feature：src 里没有任何 `cfg(feature = "kafka"/"oss")` 分支。
# - kafka：Java 侧 `CdcSyncService` 的 ES 写入整段被注释，Kafka 消费只记日志；Rust 保留
#   `/base/cdc/*` 队列管理端点（Redis 重试/死信），不启动消费者。另实测 `--features kafka`
#   在 Windows 上编不过（rdkafka-sys 4.10 的 build.rs 报“%1 不是有效的 Win32 应用程序”）。
# - oss：Java 的 `SysFileServiceImpl` 走 S3（OssTemplate），Rust 用 `ruoyi.profile/upload`
#   本地落盘并保持相同响应结构，因此不需要 S3 依赖。
# 两者只声明依赖、不接代码，删除依赖请单独提一次改动。
[features]
default = ["excel", "sysinfo"]
kafka = ["dep:rdkafka"]
excel = ["dep:rust_xlsxwriter", "dep:calamine"]
templates = ["dep:minijinja"]
oss = ["dep:aws-config", "dep:aws-sdk-s3"]
sysinfo = ["dep:sysinfo"]

[dependencies.rdkafka]
version = "0.37"
optional = true
default-features = false
features = ["tokio"]

[dependencies.rust_xlsxwriter]
version = "0.79"
optional = true

[dependencies.calamine]
version = "0.26"
optional = true

# calamine 0.26 的 ZipFile 签名停留在 zip 2.2（zip 2.6 改了泛型参数），
# 这里显式钉住版本，保证 excel 导入导出同时可用。
[dependencies.zip]
version = "=2.2.2"
default-features = false

[dependencies.minijinja]
version = "2"
optional = true
features = ["loader"]

[dependencies.aws-config]
version = "1"
optional = true

[dependencies.aws-sdk-s3]
version = "1"
optional = true

[dependencies.sysinfo]
version = "0.33"
optional = true

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
# Java 的 throwable 带栈帧，`strip = "symbols"` 会让 backtrace::resolve 全部落空。
# 实测 debug=1（仅行号表）在 Windows 下解析不到本 crate 的函数符号，
# 会只剩 std/test harness 帧；因此用 debug=2 保留完整调试信息（不 strip）。
debug = 2
