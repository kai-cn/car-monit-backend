# Rust mirror of ruoyi-admin/src/main/resources/application.yml + application-druid.yml
# Keys keep the Java names; values must stay identical unless marked "rust-only".
server:
  port: 9989

ruoyi:
  name: RuoYi
  version: 3.8.7
  profile: D:/ruoyi/uploadPath
  addressEnabled: false
  captchaType: math

user:
  password:
    maxRetryCount: 5
    lockTime: 10

token:
  header: Authorization
  secret: abcdefghijklmnopqrstuvwxyz
  expireTime: 120

database:
  url: jdbc:mysql://127.0.0.1:3307/carmonitdb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&allowMultiQueries=true&serverTimezone=GMT%2B8
  username: root
  password: root
  pool:
    initialSize: 5
    minIdle: 10
    maxActive: 200
    maxWait: 60000
    connectTimeout: 30000
    socketTimeout: 60000

redis:
  host: 127.0.0.1
  port: 6379
  database: 0
  password: ""
  timeout: 10s

kafka:
  bootstrap_servers: 127.0.0.1:9092
  topic:
    snapshot-flow: ods-rt-szdn-snapshot-flow
    snapshot-flow-dlq: ods-rt-szdn-snapshot-flow-dlq
  consumer:
    group-id: snapshot-flow-consumer-group
    concurrency: 3
    auto-offset-reset: earliest
    max-poll-records: 500
  producer:
    acks: all
    retries: 3

cdc:
  kafka:
    bootstrap-servers: localhost:9092
    topic: snapshot-flow-cdc
    group-id: snapshot-flow-cdc-group
    concurrency: 3
  es_sync:
    enabled: false
  retry:
    max-retries: 3

elasticsearch:
  host: 127.0.0.1
  port: 9200
  index: snapshot-flow
  enabled: true

oss:
  enable: true
  info: false
  endpoint: ""
  access_key: ""
  secret_key: ""
  bucket_name: ""

sms:
  signature: ""
  template:
    login: ""
    register: ""

forest:
  max-connections: 500
  connect-timeout: 60000
  read-timeout: 60000
  retry-count: 2
  variables:
    henda_url: "http://36.200.20.14:7890/8809/geoserver-pg/rest"

# Java: hengda.appid / hengda.secret（IHenDaApi 签名）
hengda:
  appid: YHZS
  secret: b48381c4b98311ea90b100155d14fa3b

# Java: vehicleMonitor.baseUrl（Forest @BaseRequest 的 baseURL）
vehicleMonitor:
  baseUrl: http://127.0.0.1:9901

# Java: isLocalhost —— local 时实时轨迹任务只落库，不做上线/驶出判定
isLocalhost: local

monitor:
  slow-request-threshold: 3000
  slow-method-threshold: 500
  slow-sql-threshold: 1000
  trace-header: X-Trace-Id
  enabled: true

xss:
  enabled: true
  url-patterns: /system/*,/monitor/*,/tool/*
  excludes: /system/notice

upload:
  max-file-size: 40MB
  max-request-size: 200MB

log:
  dir: /home/ruoyi/logs
  max-history: 60
  max-file-size: 100MB

# Java reads neither snapshot.flow.sharding.* nor sharding.enabled; both are kept
# because the user decided the Rust side must actually shard.
snapshot:
  flow:
    sharding:
      enabled: true
      table-prefix: ods_rt_szdn_snapshot_flow_
      sharding-field: snapshottime
      sharding-type: month

sharding:
  enabled: true

# Rust-only switches (documented in README-MIGRATION.md).
app:
  health-endpoint-enabled: true
  scheduler-enabled: true
  scheduled-annotations-enabled: true
  kafka-enabled: false
  elasticsearch-enabled: true
  oss-enabled: false
  banner-enabled: true

# Java: generator-code.mybatis-plus.enable —— 代码生成使用 vmplus（MyBatis-Plus）模板
generator-code:
  mybatis-plus:
    enable: true
