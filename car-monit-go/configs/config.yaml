# JAVA 对照: ruoyi-admin/src/main/resources/application.yml
# JAVA 对照: ruoyi-admin/src/main/resources/application-druid.yml
# Go 侧新增 database / redis 顶层段，替代 Druid JDBC 配置。

ruoyi:
  name: 系统
  version: 3.8.7
  copyrightYear: 2024
  profile: D:/ruoyi/uploadPath
  addressEnabled: false
  captchaType: math

server:
  port: 9989
  context-path: /
  max-threads: 800
  min-spare: 100

logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

monitor:
  enabled: true
  slow-request-threshold: 3000
  slow-method-threshold: 500
  slow-sql-threshold: 1000
  trace-id-header: X-Trace-Id
  alert-window-ms: 60000
  alert-max-count: 5

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  profiles:
    active: druid
  # 仅作 Java 原配置的对照展示，运行期不读取；生效的是顶层 redis 段（Go 用独立 DB）
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 10s

token:
  header: Authorization
  secret: abcdefghijklmnopqrstuvwxyz
  expireTime: 120

# 主数据源（application-druid.yml -> jdbc:p6spy:mysql://127.0.0.1:3307/carmonitdb）
database:
  master:
    enabled: true
    dsn: "root:root@tcp(127.0.0.1:3307)/carmonitdb?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true"
    username: root
    password: root
  slave:
    enabled: false
    dsn: ""
  pool:
    max-open-conns: 200
    max-idle-conns: 10
    conn-max-lifetime-seconds: 900
    conn-max-idle-time-seconds: 300
    slow-sql-millis: 1000

# Go 侧实际使用的 Redis 段。逐接口对比阶段与 Java 共用 MySQL(3307/carmonitdb) 但
# 使用不同的 Redis DB：Java(application.yml spring.redis.database)=0，Go=2
# （db1 已被其它移植端占用）。两端缓存互不覆盖，读回形态只由各端自己决定。
redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  database: 2
  timeout: 10s
  max-active: 8
  max-idle: 8

# JAVA 对照: application.yml:144-146
generator-code:
  mybatis-plus:
    enable: true

oss:
  endpoint: http://172.30.100.102:9002
  accessKey: jtwl_access_key
  secretKey: minio.prod
  bucketName: developer

forest:
  variables:
    hendaUrl: http://36.200.20.14:7890/8809/geoserver-pg/rest
  timeout: 60000
  hendaUrl: http://36.200.20.14:7890/8809/geoserver-pg/rest

hengda:
  appid: YHZS
  secret: b48381c4b98311ea90b100155d14fa3b

vehicleMonitor:
  baseUrl: http://127.0.0.1:9903   # car-monit-api 的 Go 端（configs/config.verify.yaml，Redis db1）；Java 端在 9902（Redis db0）

isLocalhost: local
tx-service-url: https://apis.map.qq.com
roadPathUrl: http://36.200.30.117:8080

# Kafka（默认关闭，设置 enabled: true 后启动消费者）
kafka:
  enabled: false
  bootstrap-servers:
    - 127.0.0.1:9092
  topic:
    snapshot-flow: ods-rt-szdn-snapshot-flow
    snapshot-flow-dlq: ods-rt-szdn-snapshot-flow-dlq
  consumer:
    group-id: snapshot-flow-consumer-group
    enable-auto-commit: false
    auto-offset-reset: earliest
    max-poll-records: 500

elasticsearch:
  enabled: false
  host: 127.0.0.1
  port: 9200
  index:
    snapshot-flow: snapshot-flow

idempotent:
  redis:
    prefix: "snapshot:flow:idempotent_"
    expire-time: 86400

snapshot:
  flow:
    sharding:
      enabled: true
      table-prefix: "ods_rt_szdn_snapshot_flow_"
      sharding-field: snapshottime
      sharding-type: month

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: "/system/*,/monitor/*,/tool/*"

# 雪花 ID 机器标识（Go 新增，对应 MyBatis-Plus IdWorker 的 workerId/datacenterId）。
# -1 = 按主机名自动推导；取值范围 0~31。
# 多副本部署必须保证 (datacenter-id, worker-id) 组合唯一，否则同一毫秒内会生成重复主键。
# 也可用环境变量 CARMONIT_WORKER_ID / CARMONIT_DATACENTER_ID 覆盖（优先于本段）。
instance:
  worker-id: -1
  datacenter-id: -1
