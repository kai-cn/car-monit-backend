# NOTE: this file MUST stay ASCII-only.
#   Alembic reads it with configparser using encoding="locale"; on a Chinese
#   Windows the locale is GBK, so any UTF-8 Chinese text / emoji here makes
#   `alembic` crash with UnicodeDecodeError before it even starts.
#   Chinese explanations live in alembic/env.py (read as UTF-8 Python source)
#   and in MIGRATION_GUIDE.md.
#
# Migrated from: RuoYi has NO database migration tool (no Flyway, no Liquibase).
#   Alembic is wired up for schema INSPECTION ONLY. `target_metadata` is empty
#   on purpose: the 97 MyBatis XML mappers are the single source of truth for
#   SQL, so autogenerate would only ever report "drop every table".
#   Do NOT run `alembic upgrade head` against a real database.
#
# Usage:
#   .venv\Scripts\alembic.exe current
#   .venv\Scripts\alembic.exe history
#   .venv\Scripts\alembic.exe stamp 0001_baseline   # record the existing schema (no DDL)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The real DSN is resolved in alembic/env.py from app.settings
# (application.yml -> spring.datasource.druid.master). Left empty on purpose so
# there is only one place that knows the database location.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
