# =============================================================================
# Migrated from: ruoyi-admin/src/main/resources/application.yml
# Migrated from: ruoyi-admin/src/main/resources/application-druid.yml
#
# 本文件是 Java 配置的「1:1 镜像」，用于人工 diff 对照。
# This file is a 1:1 mirror of the Java configuration, kept so that a Java
# developer can diff it against the original resources line by line.
#
# Dynamic behaviour differences (see COMPATIBILITY.md):
#   * server.tomcat.* / spring.devtools.* are accepted but have no effect;
#     uvicorn does not expose Tomcat thread pools or hot restart.
#   * mybatis-plus.* / pagehelper.* are kept as documentation of the original
#     MyBatis behaviour; the Python side uses SQLAlchemy Core + hand-ported SQL.
#   * spring.datasource.druid.slave is declared with enabled: false in Java and
#     is therefore NOT modelled (master only).
# =============================================================================

# 项目相关配置
ruoyi:
  # 名称
  name: 系统
  # 版本
  version: 3.8.7
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 9989
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# ========================================
# 监控组件配置（链路追踪、慢请求、告警）
# ========================================
monitor:
  # 监控开关（true=启用，false=关闭所有监控功能）
  enabled: true
  # 慢请求阈值（毫秒），超过此值的请求会被标记为慢请求
  slow-request-threshold: 3000
  # 慢方法阈值（毫秒），超过此值的方法调用会被记录
  slow-method-threshold: 500
  # 慢SQL阈值（毫秒），超过此值的SQL会被记录并告警
  slow-sql-threshold: 1000
  # TraceId请求头名称（微服务间传递用）
  trace-id-header: X-Trace-Id
  # 告警窗口大小（毫秒），在此窗口内同类告警只通知一次
  alert-window-ms: 60000
  # 告警阈值（窗口内允许的最大告警数）
  alert-max-count: 5

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 40MB
      # 设置总上传的文件大小
      max-request-size: 200MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: 127.0.0.1
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    # password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

  # ---------------------------------------------------------------------------
  # 数据源配置  (merged from application-druid.yml)
  # 数据源配置
  # ---------------------------------------------------------------------------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    druid:
      # 主库数据源
      master:
        url: jdbc:p6spy:mysql://127.0.0.1:3307/carmonitdb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
        username: root
        # 口令必须由环境变量 SPRING__DATASOURCE__DRUID__MASTER__PASSWORD 提供
        password:
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 200
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码（本项目不暴露 Druid 控制台，保持空值）
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（必须由环境变量 TOKEN__SECRET 提供）
  secret:
  # 令牌有效期（默认30分钟）
  expireTime: 120

# MyBatis配置
mybatis-plus:
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      id-type: ASSIGN_ID
      # 默认数据库表下划线命名
      table-underline: true
  # 搜索指定包别名 ， 除了扫描实体类包，还扫跟实体类映射相关的bean
  typeAliasesPackage: com.ruoyi.**.domain,com.ruoyi.**.bean
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

#生成mybatis-plus代码开关，默认false
generator-code:
  mybatis-plus:
    enable: true

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# minio配置
oss:
  endpoint: http://172.30.100.102:9002
  # 必须由环境变量 OSS__ACCESS_KEY / OSS__SECRET_KEY 提供（启用 OSS 时）
  accessKey:
  secretKey:
  bucketName: developer

sms:
  signature:
  accessKeyId:
  accessKeySecret:
  sendCodeTemplete:
  sendCheckPersonNoticeTemplete:
  sendExpertNoticeTemplete:
  sendSupplierInvitationsNoticeTemplete:
  sendInvitationSupplierTemplate:
  sendYckbSupplierTemplate:

forest:
  bean-id: forestConfiguration
  backend: httpclient
  max-connections: 1000 # 连接池最大连接数，默认值为500
  max-route-connections: 500 # 每个路由的最大连接数，默认值为500
  timeout: 60000 # 请求超时时间，单位为毫秒, 默认值为3000
  connect-timeout: 60000 # 连接超时时间，单位为毫秒, 默认值为2000
  logEnabled: true # 打开或关闭日志，默认为true
  retryer: com.dtflys.forest.retryer.BackOffRetryer
  retry-count: 2
  max-retry-interval: 1000
  variables:
    hendaUrl: http://36.200.20.14:7890/8809/geoserver-pg/rest

hengda:
  appid: YHZS
  # 必须由环境变量 HENGDA__SECRET 提供
  secret:

vehicleMonitor:
  baseUrl: http://127.0.0.1:9901
isLocalhost: local # 是否本地 prod生成

tx-service-url: https://apis.map.qq.com

#路网路径
roadPathUrl: http://36.200.30.117:8080

# Kafka配置（生产级优化版）
kafka:
  bootstrap-servers: 127.0.0.1:9092

  # 主题配置
  topic:
    snapshot-flow: ods-rt-szdn-snapshot-flow
    snapshot-flow-dlq: ods-rt-szdn-snapshot-flow-dlq

  consumer:
    group-id: snapshot-flow-consumer-group
    enable-auto-commit: false
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # 生产级优化配置（针对300G历史数据）
    max-poll-records: 500
    max-poll-interval-ms: 300000
    fetch-max-bytes: 52428800
    session-timeout-ms: 60000

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    retries: 3

  listener:
    ack-mode: manual_immediate
    concurrency: 3

# Elasticsearch配置
elasticsearch:
  host: 127.0.0.1
  port: 9200
  # Java: @Value("${elasticsearch.index:snapshot-flow}") -> String
  index: snapshot-flow

# 幂等性配置
idempotent:
  redis:
    prefix: snapshot:flow:idempotent_
    expire-time: 86400

# 快照流分表配置
snapshot:
  flow:
    sharding:
      enabled: true
      table-prefix: ods_rt_szdn_snapshot_flow_
      sharding-field: snapshottime
      sharding-type: month

# =============================================================================
# Python-only switches -- NOT present in the Java configuration.
# 这些开关不是新功能，而是为了「保持 Java 运行时的真实行为」而设的显式开关。
# Each one is documented in COMPATIBILITY.md.
# =============================================================================
app:
  # Phase 5 验收要求：健康检查端点 /health（Java 版没有 Actuator）。
  # 额外新增的端点，设为 false 可完全关闭、回到 Java 的 404 行为。
  health-endpoint-enabled: true
  # 等价于 Spring Boot QuartzAutoConfiguration 提供的内存版 Scheduler：
  # 启动时从 sys_job 重新装载任务（SysJobServiceImpl.@PostConstruct init()）。
  scheduler-enabled: true
  # Finding A：Java 工程里没有任何 @EnableScheduling，9 个 @Scheduled 方法
  # 实际上永不触发。默认 false = 保持与 Java 一致。
  scheduled-annotations-enabled: false
  # Kafka / MinIO 当前在运行环境中不可达；默认关闭，启动时打印告警。
  kafka-enabled: false
  elasticsearch-enabled: true
  oss-enabled: false
  # 启动横幅（等价于 RuoYiApplication.main 打印的启动成功提示）。
  banner-enabled: true
