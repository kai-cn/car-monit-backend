[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-monit-py"
version = "3.8.7"
description = "Python 3.12 port of the car-monit-backend-new Java project (RuoYi-Vue 3.8.7 / Spring Boot 2.5.15)"
requires-python = ">=3.12"
readme = "README_PY.md"

# Runtime dependencies. See requirements.txt for the pinned lock-step list.
# Dependency groups mirror the Java module they replace:
#   fastapi/uvicorn          <- spring-boot-starter-web
#   pydantic/pydantic-settings <- spring-boot-starter-validation + @ConfigurationProperties
#   SQLAlchemy/PyMySQL       <- mybatis-plus + mybatis (XML mappers) + druid
#   redis                    <- spring-boot-starter-data-redis
#   PyJWT                    <- jjwt
#   python-multipart         <- commons-fileupload / MultipartFile
#   orjson                   <- jackson-databind
#   httpx                    <- forest-http client
#   psutil                   <- oshi-core
#   openpyxl                 <- poi-ooxml / easypoi
#   Pillow                   <- kaptcha
#   (quartz)                 <- org.quartz:2.3.2, re-implemented in app/quartz/util/
#                               (scheduler.py + cron_expression.py) -- no third-party dep
#   alembic                  <- (new) schema inspection only, NOT auto-migration
dependencies = [
    "fastapi==0.115.6",
    # FastAPI 的传递依赖也显式锁定，避免上游放宽范围后解析出未测过的版本。
    "starlette==0.41.3",
    "anyio==4.15.1",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "PyMySQL==1.1.1",
    "redis==5.2.1",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "orjson==3.10.13",
    "httpx==0.28.1",
    "psutil==6.1.1",
    "openpyxl==3.1.5",
    "Pillow==11.1.0",
    "PyYAML==6.0.2",
    "alembic==1.14.0",
    "user-agents==2.2.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "pytest-cov==6.0.0",
]
# Phase 4 middleware adapters. Kept optional so the core service can boot
# while Kafka / Elasticsearch / MinIO are unreachable (as they are today).
middleware = [
    "confluent-kafka==2.6.1",
    "elasticsearch==7.17.12",
    "boto3==1.35.90",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ``config/`` 不是 Python 包（是 Java classpath 的镜像），用 data-files 装到
# ``sys.prefix/config/``；``app.settings._config_dir`` 会在源码目录缺失时回退到这里。
# 运行期需要的不止 YAML：代码生成器的 vm/vmplus 模板、导出/导入的 xlsx/docx 模板、
# i18n bundle 都从 ``CONFIG_DIR`` 读，缺一个就在非 editable 安装下 500。
[tool.setuptools.data-files]
"config" = ["config/application.yml", "config/generator.yml"]
"config/i18n" = ["config/i18n/*.properties"]
"config/templates/down" = ["config/templates/down/*"]
"config/templates/export" = ["config/templates/export/*"]
"config/vm/java" = ["config/vm/java/*.vm"]
"config/vm/js" = ["config/vm/js/*.vm"]
"config/vm/sql" = ["config/vm/sql/*.vm"]
"config/vm/vue" = ["config/vm/vue/*.vm"]
"config/vm/xml" = ["config/vm/xml/*.vm"]
"config/vmplus/java" = ["config/vmplus/java/*.vm"]
"config/vmplus/js" = ["config/vmplus/js/*.vm"]
"config/vmplus/sql" = ["config/vmplus/sql/*.vm"]
"config/vmplus/vue" = ["config/vmplus/vue/*.vm"]
"config/vmplus/xml" = ["config/vmplus/xml/*.vm"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 守住"能运行"的底线：语法错误 / 未定义名 / 明显逻辑错误 / 未使用导入。
# F401 已在 2026-11 清理完毕，之后新增未使用导入会直接阻断 CI。
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# ``integration`` marks tests that talk to the real MySQL / Redis from
# config/application.yml instead of fakes. They are collected by default and
# skip themselves when either service is unreachable, so an offline run stays
# green. Run them explicitly with:
#   python -m pytest tests/integration -v -m integration
markers = [
    "integration: hits the real MySQL / Redis configured in config/application.yml",
]
