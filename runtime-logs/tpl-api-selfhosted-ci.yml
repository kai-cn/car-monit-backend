# @description 历史运维/验证配置快照，保留用于复现与审计；本文件头补充维护背景与运行约束。
# @author Tencent Hunyuan Hy
# @date 2026-11-22
# @usage GitHub Actions workflow_dispatch 或事件触发；输入参数见 workflow inputs。
# @dependencies 按原 workflow 声明的 runner、Actions 与外部服务依赖执行。
name: self-hosted-ci

# V3 api CI/CD 模板（按分支参数化）：
# - 构建：托管优先；runner 输入或变量 CI_RUNNER_JSON 可整体切自托管。
# - 产物：push 任意分支产 jar+sha256，artifact 名带 branch+sha 防覆盖，k3d 与单机共用。
# - 部署：dispatch 选 deploy_mode=none|standalone|cluster。
#   standalone = 本机装 systemd 服务并真启动探活；cluster = 现造镜像→k3d import→set image→rollout→探活。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '构建位置（hosted=GitHub 托管，self-hosted=本机 WSL runner）'
        type: choice
        options: [hosted, self-hosted]
        default: hosted
      deploy_mode:
        description: '部署方式（none=只产产物）'
        type: choice
        options: [none, standalone, cluster]
        default: none
  push:
    branches: __BRANCHES__
    paths:
      - .github/workflows/self-hosted-ci.yml
      - pom.xml
      - pro-business-api/**

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx768m
  SERVICE: car-monit-api
  SERVICE_PORT: "9902"
  HEALTH_PATH: /base/section/list
  JAVA_MAJOR: "__JAVA_MAJOR__"
  K3D_CLUSTER: v3
  K3D_NODE: k3d-v3-server-0
  K3D_CONTAINER: api
  NODEPORT: "30902"

jobs:
  build:
    name: build-jar
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","linux","x64","wsl-k3s-api"]') || fromJSON(vars.CI_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK ${{ env.JAVA_MAJOR }} + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
          cache: maven
      - name: Compile + package（跳过测试）
        run: mvn -B -ntp -DskipTests -pl pro-business-api -am package
      - name: 收集产物 + 校验和
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(ls pro-business-api/target/*.jar | grep -v sources | head -n1)"
          echo "jar=${JAR}"
          mkdir -p dist
          cp "$JAR" dist/car-monit-api.jar
          ( cd dist && sha256sum car-monit-api.jar > car-monit-api.jar.sha256 && cat car-monit-api.jar.sha256 )
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-monit-api-jar-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  deploy-standalone:
    name: deploy-standalone（单机 systemd）
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_mode == 'standalone'
    runs-on: [self-hosted, linux, x64, wsl-k3s-api]
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: car-monit-api-jar-*
          merge-multiple: true
          path: dist
      - name: Setup JDK ${{ env.JAVA_MAJOR }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c car-monit-api.jar.sha256
          ls -lh car-monit-api.jar
      - name: 安装为 systemd 服务并启动
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.CI_OPENGAUSS_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.CI_INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          JAVA_BIN="${JAVA_HOME}/bin/java"
          [ -x "$JAVA_BIN" ] || JAVA_BIN="$(readlink -f "$(command -v java)")"
          RUN_USER="$(id -un)"; RUN_GROUP="$(id -gn)"
          echo "java=${JAVA_BIN} user=${RUN_USER}"
          sudo install -d -o "$RUN_USER" -g "$RUN_GROUP" /opt/car-monit-api
          sudo install -d /etc/car-monit
          sudo install -m 0644 dist/car-monit-api.jar /opt/car-monit-api/app.jar
          sudo tee /etc/car-monit/api.env >/dev/null <<EOF
          SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD=${DB_PASSWORD}
          TRAFFIC_INTERNAL_TOKEN=${INTERNAL_TOKEN}
          SPRING_DATA_REDIS_HOST=172.18.0.1
          SPRING_DATA_REDIS_PORT=6379
          SPRING_KAFKA_BOOTSTRAP_SERVERS=172.18.0.1:9092
          ELASTICSEARCH_HOST=172.18.0.1
          ELASTICSEARCH_PORT=9200
          ELASTICSEARCH_SCHEME=http
          LOG_ROOT_LEVEL=info
          EOF
          sudo chmod 600 /etc/car-monit/api.env
          sudo tee /etc/systemd/system/car-monit-api.service >/dev/null <<EOF
          [Unit]
          Description=car-monit api (standalone, CI-deployed)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=${RUN_USER}
          Group=${RUN_GROUP}
          WorkingDirectory=/opt/car-monit-api
          EnvironmentFile=/etc/car-monit/api.env
          ExecStart=${JAVA_BIN} --add-opens=java.base/java.lang=ALL-UNNAMED -Xms128m -Xmx256m -XX:+UseSerialGC -jar /opt/car-monit-api/app.jar --server.port=${SERVICE_PORT} --spring.datasource.dynamic.datasource.master.url=jdbc:postgresql://172.18.0.1:5432/RuoYi?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai --traffic.query.engine=es --traffic.sync.enabled=true --spring.main.lazy-initialization=false --logging.level.p6spy=OFF
          Restart=always
          RestartSec=5
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable car-monit-api
          sudo systemctl restart car-monit-api
      - name: 健康检查（真实启动）
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${SERVICE_PORT}${HEALTH_PATH}" || true)"
            if [ "${code}" = "200" ]; then echo "standalone api UP (try=$i)"; exit 0; fi
            sleep 2
          done
          echo "::error::单机 api 未在 120s 内就绪"
          sudo systemctl status car-monit-api --no-pager || true
          sudo journalctl -u car-monit-api --no-pager | tail -40 || true
          exit 1

  deploy-cluster:
    name: deploy-k3d-cluster
    needs: build
    if: |
      always() && needs.build.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_mode == 'cluster') ||
        (github.event_name == 'push' && vars.AUTO_DEPLOY_CLUSTER == 'true')
      )
    runs-on: [self-hosted, linux, x64, wsl-k3s-api]
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: car-monit-api-jar-*
          merge-multiple: true
          path: dist
      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c car-monit-api.jar.sha256
      - name: 确保 docker 与 k3d 集群就绪
        shell: bash
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            sudo -n systemctl start docker 2>/dev/null || true
            for i in $(seq 1 12); do docker info >/dev/null 2>&1 && break; sleep 5; done
          fi
          docker info >/dev/null 2>&1 || { echo "::error::docker 不可用"; exit 1; }
          for c in k3d-v3-server-0 k3d-v3-agent-0 k3d-v3-agent-1; do
            docker ps --format '{{.Names}}' | grep -Fxq -- "$c" || docker start "$c" || true
          done
          for i in $(seq 1 24); do
            docker exec "${K3D_NODE}" kubectl get nodes >/dev/null 2>&1 && { echo "k3d ready"; exit 0; }
            sleep 5
          done
          echo "::error::k3d API 未在 120s 内就绪"; exit 1
      - name: 现造镜像并导入 k3d
        shell: bash
        run: |
          set -euo pipefail
          IMG="car-monit-api:ci-${GITHUB_SHA::7}"
          cat > /tmp/Dockerfile.api <<'EOF'
          FROM car-monit-api:slim
          COPY car-monit-api.jar /app/app.jar
          EOF
          docker build -f /tmp/Dockerfile.api -t "$IMG" dist
          k3d image import "$IMG" -c "${K3D_CLUSTER}"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: 更新镜像并等待 rollout
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${K3D_NODE}" kubectl set image "deployment/car-monit-api" "${K3D_CONTAINER}=${IMG}"
          docker exec "${K3D_NODE}" kubectl rollout status "deployment/car-monit-api" --timeout=300s
          docker exec "${K3D_NODE}" kubectl get pods -l app=car-monit-api -o wide
      - name: 健康检查（NodePort 公开端点=200，动态解析节点 IP）
        shell: bash
        run: |
          set -euo pipefail
          NODE_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${K3D_NODE}")"
          echo "server node ip=${NODE_IP}"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://${NODE_IP}:${NODEPORT}${HEALTH_PATH}" || true)"
            if [ "${code}" = "200" ]; then echo "k3d api UP (try=$i)"; exit 0; fi
            sleep 3
          done
          echo "::error::k3d api 未在 90s 内就绪"
          docker exec "${K3D_NODE}" kubectl logs deployment/car-monit-api --tail=40 || true
          exit 1
